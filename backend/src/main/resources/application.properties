# Banco de dados
# Os valores padrão (após ':') apontam para o Postgres do compose.yaml local.
# Em produção, defina DB_URL / DB_USERNAME / DB_PASSWORD como variáveis de ambiente reais para sobrescrever.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portal}
spring.datasource.username=${DB_USERNAME:portal}
spring.datasource.password=${DB_PASSWORD:portal123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

server.port=${PORT:10000}